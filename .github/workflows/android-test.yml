name: android-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TOOLS_VERSION: 37.0.0

jobs:
  host-test:
    name: Host TypeScript Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: android/host/pnpm-lock.yaml

      - name: Install host dependencies
        working-directory: android/host
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, and test host
        working-directory: android/host
        run: pnpm run check

  android-unit-test:
    name: Android Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: android/host/pnpm-lock.yaml

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Android SDK packages
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install
          "platforms;android-37.0" "build-tools;$BUILD_TOOLS_VERSION" "ndk;30.0.16248370" "cmake;4.1.2" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Cache Robolectric Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-robolectric-m2-${{ hashFiles('android/app/build.gradle.kts', 'android/app/src/test/**/AndroidSqlDbTest.kt') }}
          restore-keys: |
            ${{ runner.os }}-robolectric-m2-

      - name: Run Android ktlint, detekt & JVM unit tests
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gradle :app:ktlintCheck :app:detektDebug :app:detektDebugUnitTest :app:testDebugUnitTest
          -Drobolectric.dependency.repo.url=https://maven-central.storage-download.googleapis.com/maven2
          --no-daemon --stacktrace --continue

      - name: Generate and verify Compose stability reports
        working-directory: android
        run: |
          rm -rf app/build/compose_compiler
          gradle -Poopbot.composeReports=true :app:compileDebugKotlin --no-daemon --stacktrace
          python3 scripts/check-compose-reports.py app/build/compose_compiler

      - name: Upload Android unit test, lint & Compose reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/ktlint/
            android/app/build/reports/detekt/
            android/app/build/compose_compiler/
          if-no-files-found: ignore
