name: build-termux

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: aarch64-linux-android
  # Termux butuh Android 7+ (API 24)
  ANDROID_API: "24"
  BIN_NAME: oopbot
  SO_NAME: liboopbot.so
  BUILD_TOOLS_VERSION: 37.0.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  build-android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}

      - name: Konfigurasi linker Android NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          test -d "$NDK" || { echo "Android NDK tidak ditemukan"; exit 1; }
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC="$BIN/${TARGET}${ANDROID_API}-clang"
          test -x "$CC" || { echo "Compiler tidak ditemukan: $CC"; exit 1; }
          {
            echo "CC_aarch64_linux_android=$CC"
            echo "AR_aarch64_linux_android=$BIN/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CC"
          } >> "$GITHUB_ENV"

      - name: Build release (binary + cdylib .so)
        run: cargo build --release --locked --target "$TARGET"

      - name: Kemas binary & shared library (.so)
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/$BIN_NAME" "dist/$BIN_NAME-$TARGET"
          cp "target/$TARGET/release/$SO_NAME" "dist/lib$BIN_NAME-$TARGET.so"
          cd dist
          sha256sum "$BIN_NAME-$TARGET" > "$BIN_NAME-$TARGET.sha256"
          sha256sum "lib$BIN_NAME-$TARGET.so" > "lib$BIN_NAME-$TARGET.so.sha256"
          file "$BIN_NAME-$TARGET" "lib$BIN_NAME-$TARGET.so" || true
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ env.TARGET }}
          path: dist/*

      - name: Publikasikan Binary & .so ke GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi

  build-apk:
    name: Build Android APK (Pipkin UI + liboopbot.so)
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download compiled Rust liboopbot.so
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ env.TARGET }}
          path: rust-dist

      - name: Bundle liboopbot.so into Android jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp "rust-dist/lib$BIN_NAME-$TARGET.so" android/app/src/main/jniLibs/arm64-v8a/liboopbot.so
          ls -lh android/app/src/main/jniLibs/arm64-v8a/liboopbot.so

      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Android SDK packages
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install
          "platforms;android-37.0" "build-tools;$BUILD_TOOLS_VERSION" "ndk;30.0.16248370" "cmake;4.1.2" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK (installable out-of-the-box)
        working-directory: android
        run: |
          VER="${GITHUB_REF_NAME#v}"
          ./gradlew :app:assembleDebug -Ppipkin.versionName="$VER" -Ppipkin.versionCode=1
          mkdir -p ../apk-dist
          APK_FILE=$(find app/build -name "*.apk" | head -n 1)
          echo "Found built APK: $APK_FILE"
          test -n "$APK_FILE" && cp "$APK_FILE" "../apk-dist/oopbot-pipkin-${GITHUB_REF_NAME}-arm64.apk"
          cd ../apk-dist
          sha256sum "oopbot-pipkin-${GITHUB_REF_NAME}-arm64.apk" > "oopbot-pipkin-${GITHUB_REF_NAME}-arm64.apk.sha256"
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: oopbot-pipkin-apk
          path: apk-dist/*

      - name: Publikasikan APK ke GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release upload "$TAG" apk-dist/* --clobber
